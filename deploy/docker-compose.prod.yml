# Production stack for a single small host (see deploy/README.md):
# Caddy (HTTPS) in front of Next.js and the Go services, Elasticsearch on
# the same host, DynamoDB/S3/SES as AWS managed services.
# Only Caddy publishes ports. Values come from deploy/.env.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-go-env: &go-env
  TZ: Europe/Paris
  AWS_REGION: ${AWS_REGION:-eu-west-3}
  # Empty keys fall back to the default AWS chain (e.g. an EC2 instance role).
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # Real DynamoDB when unset (the rehearsal override points it at DynamoDB Local).
  DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}
  FRONTEND_ORIGINS: ${APP_URL:?set APP_URL}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  COOKIE_SECURE: "true"
  # Web push (optional; push stays off without keys).
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}

x-go-healthcheck: &go-healthcheck
  interval: 10s
  timeout: 3s
  retries: 30

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: keep them, Let's Encrypt rate-limits reissues.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - nextjs
    logging: *logging

  nextjs:
    build:
      context: ../srcs/frontend
      dockerfile: ../../docker/frontend/Dockerfile.prod
      # Paths, not URLs: the browser calls the services on whatever origin
      # served the page (Caddy proxies /svc/*), so the image does not depend
      # on the domain.
      args:
        NEXT_PUBLIC_API_URL: /svc/api
        NEXT_PUBLIC_LOGIN_URL: /svc/auth
        NEXT_PUBLIC_CHAT_URL: /svc/chat
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      API_INTERNAL_URL: http://apiserver:8080
      LOGIN_INTERNAL_URL: http://loginserver:7070
      CHAT_INTERNAL_URL: http://chatserver:9090
    depends_on:
      apiserver:
        condition: service_healthy
    logging: *logging

  apiserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/apiserver/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ENABLE_DEBUG_ROUTES: "false"
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      # Only for S3-compatible storage; leave empty on AWS.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Housing/job posts: gross hourly minimum wage (warned below it) and
      # the account age needed to post. Empty = code defaults.
      SMIC_HOURLY: ${SMIC_HOURLY:-}
      LISTING_MIN_ACCOUNT_DAYS: ${LISTING_MIN_ACCOUNT_DAYS:-}
      # Notification mails go through the same SMTP as verification mails.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      PUBLIC_APP_URL: ${APP_URL}
      PUBLIC_API_URL: ${APP_URL}/svc/api
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging: *logging

  loginserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/loginserver/Dockerfile
    restart: unless-stopped
    environment:
      <<: *go-env
      # Caddy is the only client; the real IP is in X-Forwarded-For.
      TRUST_PROXY: "true"
      PUBLIC_APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${APP_URL}/svc/auth/auth/google/callback
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/healthz"]
    # apiserver creates the tables.
    depends_on:
      apiserver:
        condition: service_healthy
    logging: *logging

  chatserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/chatserver/Dockerfile
    restart: unless-stopped
    environment: *go-env
    healthcheck:
      <<: *go-healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
    depends_on:
      apiserver:
        condition: service_healthy
    logging: *logging

  # Search index only: it is rebuilt from DynamoDB when missing, so losing
  # this volume costs a reindex, not data.
  elasticsearch:
    build: ../docker/elasticsearch
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
      # Not published and reachable only on the compose network. Features
      # the app does not use are off to save memory on a 2GB host.
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      xpack.monitoring.collection.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  es-data:
