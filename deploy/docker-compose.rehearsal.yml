# Runs the production stack locally without AWS (make rehearsal):
# DynamoDB Local, MinIO and MailHog stand in for DynamoDB, S3 and SES,
# and Caddy serves https://localhost:8443 with its internal CA.
services:
  # Adds /media/* in front of MinIO, so uploaded photos are served from
  # the same origin (S3_PUBLIC_URL=<APP_URL>/media), also through a tunnel.
  caddy:
    volumes:
      - ./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro

  apiserver:
    depends_on:
      dynamodb:
        condition: service_started
      minio:
        condition: service_healthy

  loginserver:
    depends_on:
      mailhog:
        condition: service_started

  dynamodb:
    image: amazon/dynamodb-local

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    ports:
      - "9002:9000"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8026:8025"
