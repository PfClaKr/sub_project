<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇냥</title>
<style>
	:root { color-scheme: light; }
	* { box-sizing: border-box; }
	body {
		margin: 0;
		min-height: 100vh;
		display: grid;
		place-items: center;
		padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
		color: #1f2433;
		background: #ffffff;
		text-align: center;
	}
	.logo {
		display: block;
		margin: 0 auto 20px;
		border-radius: 18px;
	}
	h1 { margin: 0 0 8px; font-size: 22px; color: #101750; }
	p { margin: 0 0 24px; color: #5d6382; line-height: 1.6; }
	button {
		padding: 12px 28px;
		border: none;
		border-radius: 10px;
		background: #0048b4;
		color: #fff;
		font: inherit;
		font-weight: 700;
	}
</style>
</head>
<body>
	<main>
		<img class="logo" src="icon.png" alt="" width="72" height="72">
		<h1>잇냥에 연결할 수 없어요</h1>
		<p>인터넷 연결을 확인한 뒤<br>다시 시도해주세요.</p>
		<button type="button" id="retry">다시 시도</button>
	</main>
	<script src="app-config.js"></script>
	<script>
		document.getElementById("retry").addEventListener("click", function () {
			if (window.ITNYANG_SERVER_URL) location.href = window.ITNYANG_SERVER_URL;
			else location.reload();
		});
	</script>
</body>
</html>
