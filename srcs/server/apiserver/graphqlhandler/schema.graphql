# schema.graphql
# Object types are built from this file (see graphqlHandler.go);
# root fields are dispatched through the resolvers map.
# Mutations act as the user in the session cookie, never an argument.

type Query {
  product(ProductId: String!): Product
  # Sort: relevance (default) | newest | price_asc | price_desc | distance.
  # Place filter: AreaId alone = inside that town / arrondissement;
  # Latitude/Longitude + DistanceKm = within that distance.
  productSearch(ProductName: String!, Category: String, Region: String, MinPrice: Float, MaxPrice: Float, Sort: String, AreaId: String, Latitude: Float, Longitude: Float, DistanceKm: Float): ProductSearchResult
  # Kept for the current search page; prefer productSearch. An empty
  # Keyword lists everything matching the filters. Sort "recent" = newest.
  searchProducts(Keyword: String, Category: String, Region: String, MinPrice: Float, MaxPrice: Float, Sort: String): [Product]
  # Autocomplete: distinct product names for what the user typed so far.
  searchSuggestions(Prefix: String!): [String]
  recentProducts(Limit: Float, Offset: Float, Category: String): [Product]
  userProducts(UserId: String!): [Product]
  user(UserId: String!): User
  # Public numbers for the landing page.
  marketStats: MarketStats
  # Newest first, 30 per page; pass the previous page's Next as Before.
  notifications(Before: String): NotificationPage
  # 0 for anonymous visitors.
  unreadCount: Int
  # Community boards. Type: "free", "qna" or "community" (both, default).
  # Sort: "newest" (default), "popular", or relevance when Q is set.
  posts(Type: String, Topic: String, City: String, Q: String, Solved: Boolean, Sort: String, Page: Int, Size: Int): PostPage
  post(PostId: String!): Post
  comments(PostId: String!): [Comment]
  similarQuestions(Title: String!): [Post]
  myPosts(Type: String): [Post]
  myBookmarks: [Post]
  # Housing or job posts. Type: "housing" or "job". Sort: newest (default),
  # rent_asc, wage_desc, available, distance (with a place), or relevance
  # when Q is set. AreaId/Latitude/Longitude/DistanceKm as productSearch.
  listings(Type: String!, City: String, Q: String, Housing: HousingFilter, Job: JobFilter, AreaId: String, Latitude: Float, Longitude: Float, DistanceKm: Float, Sort: String, Page: Int, Size: Int): PostPage
  listing(PostId: String!): Post
}

type Mutation {
  createProduct(ProductName: String!, ProductDescription: String!, ProductPrice: Float!, ProductCategory: String!, ProductImage: [String!], PreferedLocation: String!, ProductRegion: String, Latitude: Float, Longitude: Float, ExactLocation: Boolean): Product
  updateProduct(ProductId: String!, ProductName: String!, ProductDescription: String!, ProductPrice: Float!, ProductCategory: String!, ProductImage: [String!], PreferedLocation: String!, ProductRegion: String, Latitude: Float, Longitude: Float, ExactLocation: Boolean): Product
  updateProductStatus(ProductId: String!, ProductStatus: String!): Product
  deleteProduct(ProductId: String!): Boolean
  updateProfile(UserNickname: String!, ProfileImage: String): User
  # Without SortKeys every notification is marked read. Returns how many changed.
  markNotificationsRead(SortKeys: [String!]): Int
  createPost(Input: PostInput!): Post
  # Type and Anonymous cannot change after posting.
  updatePost(PostId: String!, Input: PostInput!): Post
  deletePost(PostId: String!): Boolean
  likePost(PostId: String!, On: Boolean!): Post
  bookmarkPost(PostId: String!, On: Boolean!): Boolean
  viewPost(PostId: String!): Int
  createComment(PostId: String!, Body: String!, ParentId: String, Anonymous: Boolean): Comment
  deleteComment(PostId: String!, CommentId: String!): Boolean
  acceptAnswer(PostId: String!, CommentId: String!): Post
  # TargetType: post, comment ("<postId>#<commentId>"), product, user.
  report(TargetType: String!, TargetId: String!, Reason: String!, Detail: String): Boolean
  # With risky text and no Acknowledge, nothing is saved: Post is null and
  # Warnings lists the codes to explain; send again with Acknowledge.
  createListing(Input: ListingInput!, Acknowledge: Boolean): ListingResult
  updateListing(PostId: String!, Input: ListingInput!, Acknowledge: Boolean): ListingResult
  # Deal: open, reserved, closed.
  setListingDeal(PostId: String!, Deal: String!): Post
  extendListing(PostId: String!): Post
  bumpListing(PostId: String!): Post
  # Job posts: the employer's phone/email, for logged-in members.
  revealContact(PostId: String!): Contact
}

type Product {
  ProductId: String
  UserId: String
  SellerNickname: String
  ProductStatus: String
  ProductName: String
  ProductDescription: String
  ProductPrice: Float
  ProductCategory: String
  ProductRegion: String
  ProductImage: [String]
  PreferedLocation: String
  # Map position. ExactLocation false = only the town / arrondissement
  # (AreaId, AreaName) is shown and Latitude/Longitude is its centre.
  Latitude: Float
  Longitude: Float
  ExactLocation: Boolean
  AreaId: String
  AreaName: String
  ProductCreatedAt: Float
  ProductUpdatedAt: Float
}

type MarketStats {
  Products: Float
  Selling: Float
  Users: Float
}

# Corrected is true when nothing matched exactly and Products come
# from the typo-tolerant fallback.
type ProductSearchResult {
  Products: [Product]
  Corrected: Boolean
}

# Email and credentials are intentionally not exposed.
type User {
  UserId: String
  UserNickname: String
  ProfileImage: String
  Residence: String
  PublishedQuantity: Float
  CreatedAt: Float
}

# In-app notification (see package/notify). Link is the site path to open.
type Notification {
  SortKey: String
  Type: String
  ActorId: String
  TargetType: String
  TargetId: String
  Preview: String
  Link: String
  Read: Boolean
  CreatedAt: Float
}

# Next is empty on the last page.
type NotificationPage {
  Items: [Notification]
  Next: String
}

# Structured part of a housing post. Mode: offer or seek.
type HousingInfo {
  Mode: String
  Kind: String
  Rent: Float
  ChargesIncluded: Boolean
  Deposit: Float
  AvailableFrom: String
  EndDate: String
  MinMonths: Float
  Size: Float
  Rooms: Float
  Furnished: Boolean
  Caf: Boolean
  Pets: Boolean
}

# Structured part of a job post. Mode: hiring or seeking. WageType:
# hourly, monthly or negotiable.
type JobInfo {
  Mode: String
  Sector: String
  Employment: String
  WageType: String
  Wage: Float
  Schedule: String
  PermitRequired: Boolean
  Languages: [String]
}

# Community post. AuthorId is empty for anonymous posts; IsMine tells the
# viewer whether they wrote it. Liked/Bookmarked are only set on post().
type Post {
  PostId: String
  Type: String
  Topic: String
  City: String
  Title: String
  Body: String
  BodyPreview: String
  Images: [String]
  Status: String
  Anonymous: Boolean
  AuthorId: String
  AuthorNickname: String
  AuthorImage: String
  IsMine: Boolean
  CreatedAt: Float
  UpdatedAt: Float
  CommentCount: Float
  LikeCount: Float
  ViewCount: Float
  AcceptedCommentId: String
  Solved: Boolean
  Liked: Boolean
  Bookmarked: Boolean
  # Housing and job posts only.
  Housing: HousingInfo
  Job: JobInfo
  Deal: String
  ExpiresAt: Float
  BumpedAt: Float
  AreaId: String
  AreaName: String
  Latitude: Float
  Longitude: Float
  ExactLocation: Boolean
  HasContact: Boolean
}

type Contact {
  Phone: String
  Email: String
}

type ListingResult {
  Post: Post
  Warnings: [String]
}

type PostPage {
  Items: [Post]
  Page: Int
  TotalPages: Int
  Total: Int
  Corrected: Boolean
}

# DisplayName is the nickname, the numbered anonymous label, the
# anonymous-author label or the deleted-member label (see comments.go);
# deleted comments come back empty, only as parents of replies.
# (graphql-go's lexer mishandles non-ASCII text in comments.)
type Comment {
  CommentId: String
  PostId: String
  ParentId: String
  Body: String
  DisplayName: String
  AuthorId: String
  AuthorImage: String
  Anonymous: Boolean
  IsMine: Boolean
  IsPostAuthor: Boolean
  Deleted: Boolean
  Accepted: Boolean
  CreatedAt: Float
}

input PostInput {
  Type: String!
  Topic: String!
  City: String
  Title: String!
  Body: String!
  Images: [String!]
  Anonymous: Boolean
}

input HousingInput {
  Mode: String!
  Kind: String!
  Rent: Float!
  ChargesIncluded: Boolean
  Deposit: Float
  AvailableFrom: String!
  EndDate: String
  MinMonths: Int
  Size: Float
  Rooms: Int
  Furnished: Boolean
  Caf: Boolean
  Pets: Boolean
}

input JobInput {
  Mode: String!
  Sector: String!
  Employment: String!
  WageType: String!
  Wage: Float
  Schedule: String
  PermitRequired: Boolean
  Languages: [String!]
}

input ContactInput {
  Phone: String
  Email: String
}

# Latitude/Longitude are the picked point; housing always shows only the
# neighbourhood, a job may show the exact place (ExactLocation).
input ListingInput {
  Type: String!
  Title: String!
  Body: String!
  City: String
  Images: [String!]
  Latitude: Float!
  Longitude: Float!
  ExactLocation: Boolean
  Housing: HousingInput
  Job: JobInput
  Contact: ContactInput
}

input HousingFilter {
  Mode: String
  Kinds: [String!]
  MinRent: Float
  MaxRent: Float
  AvailableBy: String
  Furnished: Boolean
  Caf: Boolean
  Pets: Boolean
}

input JobFilter {
  Mode: String
  Sectors: [String!]
  Employment: [String!]
  MinWage: Float
  PermitFree: Boolean
}
