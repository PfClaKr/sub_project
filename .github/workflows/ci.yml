name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - apiserver
          - loginserver
          - chatserver
          - package/cors
          - package/jwt
          - package/jsonresponse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet, build and test
        working-directory: srcs/server/${{ matrix.module }}
        run: |
          go vet ./...
          go build ./...
          go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: srcs/frontend/package-lock.json
      - name: Install, type-check and build
        working-directory: srcs/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Verify PWA assets
        working-directory: srcs/frontend
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/manifest.webmanifest >/dev/null && break
            sleep 1
          done
          node scripts/check-pwa.mjs
