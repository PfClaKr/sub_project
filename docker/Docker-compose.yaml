services:
  nextjs:
    build:
      context: ../srcs/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    volumes:
      - "../srcs/frontend:/app"
    restart: always
    container_name: nextjs
    ports:
      - "3000:3000"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=development
      # SSR-side endpoints (compose network)
      - API_INTERNAL_URL=http://apiserver:8080
      - LOGIN_INTERNAL_URL=http://loginserver:7070
      - CHAT_INTERNAL_URL=http://chatserver:9090
      # Browser-side endpoints (host-published ports)
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_LOGIN_URL=http://localhost:7070
      - NEXT_PUBLIC_CHAT_URL=http://localhost:9090

  dynamodb:
    image: amazon/dynamodb-local
    restart: always
    container_name: dynamodb
    # Persist data on disk instead of the default in-memory mode.
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    ports:
      - "8000:8000"

  apiserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/apiserver/Dockerfile
    volumes:
      - "../srcs/server/apiserver:/app/apiserver"
    container_name: apiserver
    restart: always
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Paris
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - FRONTEND_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=local_dev_secret
      # S3-compatible storage; point to real S3 after cloud migration
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_BUCKET=product-images
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - dynamodb
      - elasticsearch
      - minio

  loginserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/loginserver/Dockerfile
    volumes:
      - "../srcs/server/loginserver:/app/loginserver"
    container_name: loginserver
    restart: always
    ports:
      - "7070:7070"
    environment:
      - TZ=Europe/Paris
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - FRONTEND_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=local_dev_secret
    depends_on:
      - apiserver

  chatserver:
    build:
      context: ../srcs/server
      dockerfile: ../../docker/chatserver/Dockerfile
    volumes:
      - "../srcs/server/chatserver:/app/chatserver"
    container_name: chatserver
    restart: always
    ports:
      - "9090:9090"
    environment:
      - TZ=Europe/Paris
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - AWS_REGION=eu-west-3
      - AWS_ACCESS_KEY_ID=dummy
      - AWS_SECRET_ACCESS_KEY=dummy
      - FRONTEND_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=local_dev_secret
    depends_on:
      - apiserver

  minio:
    image: minio/minio
    container_name: minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data

  elasticsearch:
    container_name: elasticsearch
    build: ./elasticsearch
    ports:
      - "9200:9200"
    environment:
      - TZ=Europe/Paris
      - ELASTICSEARCH_URL="https://elasticsearch:9200"
      - ELASTIC_PASSWORD="1"
      - ELASTIC_CERT_PASSWORD="1"
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  # kibana:
  #   container_name: kibana
  #   build: ./kibana
  #   ports:
  #     - "5601:5601"
  #   restart: always
  #   environment:
  #     - ELASTIC_PASSWORD="1"
  #   depends_on:
  #     - elasticsearch

volumes:
  minio-data:
  dynamodb-data:
